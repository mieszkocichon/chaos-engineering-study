apiVersion: batch/v1
kind: Job
metadata:
  name: coordinator
  namespace: chaos-experiment
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 120
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: coordinator
          image: chaos-experiment:latest
          imagePullPolicy: Never
          command: ["node", "runner/coordinator.js"]
          env:
            - name: TOPOLOGY
              value: "scale-20"
            - name: FAULT_PROFILE
              value: "baseline-flaky"
            - name: STRATEGY
              value: "none"
            - name: SEED
              value: "42"
            - name: BASE_PORT
              value: "4000"
            - name: RPS
              value: "50"
            - name: DURATION_SEC
              value: "60"
            - name: WARMUP_SEC
              value: "10"
            - name: RESULTS_DIR
              value: "/results"
            - name: HEALTH_TIMEOUT_MS
              value: "300000"
          volumeMounts:
            - name: topology-vol
              mountPath: /app/config/topologies
            - name: fault-vol
              mountPath: /app/config/faults
            - name: results-vol
              mountPath: /results
      volumes:
        - name: topology-vol
          configMap:
            name: topology
        - name: fault-vol
          configMap:
            name: fault-profile
        - name: results-vol
          hostPath:
            path: /results-host
            type: DirectoryOrCreate