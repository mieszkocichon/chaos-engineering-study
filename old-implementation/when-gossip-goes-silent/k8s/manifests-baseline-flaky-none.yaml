apiVersion: v1
kind: Namespace
metadata:
  name: chaos-experiment
  labels:
    experiment: chaos
    strategy: "none"
    fault: "baseline-flaky"

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: topology
  namespace: chaos-experiment
data:
  scale-20.json: |
    {
      "name": "scale-20",
      "description": "20-node layered topology: 1 gateway + 4 mid-tier (svc-a/b/c/d) + 15 leaf nodes. Gossip evaluation at scale (N>=20).",
      "defaults": {
        "processingDelayMs": {
          "distribution": "normal",
          "mean": 20,
          "std": 5
        }
      },
      "services": [
        {
          "id": "gateway",
          "role": "entry"
        },
        {
          "id": "svc-a"
        },
        {
          "id": "svc-b"
        },
        {
          "id": "svc-c"
        },
        {
          "id": "svc-d"
        },
        {
          "id": "svc-1"
        },
        {
          "id": "svc-2"
        },
        {
          "id": "svc-3"
        },
        {
          "id": "svc-4"
        },
        {
          "id": "svc-5"
        },
        {
          "id": "svc-6"
        },
        {
          "id": "svc-7"
        },
        {
          "id": "svc-8"
        },
        {
          "id": "svc-9"
        },
        {
          "id": "svc-10"
        },
        {
          "id": "svc-11"
        },
        {
          "id": "svc-12"
        },
        {
          "id": "svc-13"
        },
        {
          "id": "svc-14"
        },
        {
          "id": "svc-15"
        }
      ],
      "edges": [
        {
          "from": "gateway",
          "to": "svc-a"
        },
        {
          "from": "gateway",
          "to": "svc-b"
        },
        {
          "from": "gateway",
          "to": "svc-c"
        },
        {
          "from": "gateway",
          "to": "svc-d"
        },
        {
          "from": "svc-a",
          "to": "svc-1"
        },
        {
          "from": "svc-b",
          "to": "svc-2"
        },
        {
          "from": "svc-c",
          "to": "svc-3"
        },
        {
          "from": "svc-d",
          "to": "svc-4"
        },
        {
          "from": "svc-a",
          "to": "svc-5"
        },
        {
          "from": "svc-b",
          "to": "svc-6"
        },
        {
          "from": "svc-c",
          "to": "svc-7"
        },
        {
          "from": "svc-d",
          "to": "svc-8"
        },
        {
          "from": "svc-a",
          "to": "svc-9"
        },
        {
          "from": "svc-b",
          "to": "svc-10"
        },
        {
          "from": "svc-c",
          "to": "svc-11"
        },
        {
          "from": "svc-d",
          "to": "svc-12"
        },
        {
          "from": "svc-a",
          "to": "svc-13"
        },
        {
          "from": "svc-b",
          "to": "svc-14"
        },
        {
          "from": "svc-c",
          "to": "svc-15"
        }
      ]
    }

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: fault-profile
  namespace: chaos-experiment
data:
  baseline-flaky.json: |
    {
      "name": "baseline-flaky",
      "description": "Persistent 20% packet loss on svc-b via tc netem throughout the experiment. Models unstable network link.",
      "faults": [
        {
          "targetService": "svc-b",
          "type": "baseline-flaky",
          "startTimeSec": 5,
          "endTimeSec": 999
        }
      ]
    }
    

---

apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: chaos-experiment
spec:
  selector:
    app: gateway
  ports:
    - port: 4000
      targetPort: 4000

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: chaos-experiment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: service
          image: chaos-experiment:latest
          imagePullPolicy: Never
          command: ["node", "runner/service-runner.js"]
          env:
            - name: SERVICE_ID
              value: "gateway"
            - name: TOPOLOGY
              value: "scale-20"
            - name: FAULT_PROFILE
              value: "baseline-flaky"
            - name: STRATEGY
              value: "none"
            - name: SEED
              value: "42"
            - name: BASE_PORT
              value: "4000"
          ports:
            - containerPort: 4000
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          volumeMounts:
            - name: topology-vol
              mountPath: /app/config/topologies
            - name: fault-vol
              mountPath: /app/config/faults
      volumes:
        - name: topology-vol
          configMap:
            name: topology
        - name: fault-vol
          configMap:
            name: fault-profile

---

