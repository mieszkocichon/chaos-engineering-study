# AUTOMATICALLY GENERATED BY generate-swarm-topology.js
# Topology: RING (50 nodes) - SWARM MODE

version: '3.8'

x-common-env: &common-env
  TOPOLOGY: ring-50
  FAULT_PROFILE: cascade-crash
  STRATEGY: none
  SEED: "2000"
  BASE_PORT: "4000"

# Volume mount: we mount when-gossip-goes-silent/config to /app/config in each container.
# This makes dynamically generated topology files (ring-N.json) visible
# without rebuilding the Docker image after each experiment iteration.
x-config-volume: &config-volume
  - ./config:/app/config:ro

services:

  gateway:
    image: chaos-experiment:latest
    environment:
      SIMULATE_CLOCK_SKEW: "true"
      SIMULATE_IO_CONTENTION: "true"
      <<: *common-env
      SERVICE_ID: gateway
      DOWNSTREAM_SERVICES: "svc-01,svc-02,svc-03,svc-04,svc-05,svc-06,svc-07,svc-08,svc-09,svc-10,svc-11,svc-12,svc-13,svc-14,svc-15,svc-16,svc-17,svc-18,svc-19,svc-20,svc-21,svc-22,svc-23,svc-24,svc-25,svc-26,svc-27,svc-28,svc-29,svc-30,svc-31,svc-32,svc-33,svc-34,svc-35,svc-36,svc-37,svc-38,svc-39,svc-40,svc-41,svc-42,svc-43,svc-44,svc-45,svc-46,svc-47,svc-48,svc-49,svc-50"
    volumes: *config-volume
    ports:
      - "4000:4000"
    networks:
      - chaos-net
    cap_add:
      - NET_ADMIN
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        reservations:
          cpus: '0.05'
          memory: 32M
        limits:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r => {if(!r.ok) process.exit(1)}).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

